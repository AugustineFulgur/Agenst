plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'indi.augusttheodor.agenst'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.javassist:javassist:3.30.2-GA'
}

configurations {
    windowsTools
    linuxTools
}

dependencies {
    windowsTools files(projectDir.path + '/lib-windows/tools.jar')
    linuxTools files(projectDir.path + '/lib-linux/tools.jar')
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 8
    classpath = configurations.compileClasspath + configurations.windowsTools
}

task compileLinux(type: JavaCompile) {
    source = sourceSets.main.java
    classpath = configurations.compileClasspath + configurations.linuxTools
    destinationDirectory = file("${buildDir}/classes/linux")
    options.encoding = 'UTF-8'
    options.release = 8
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

shadowJar {
    archiveClassifier = 'windows'
    relocate 'javassist', 'indi.augusttheodor.shaded.javassist'
    from {
        zipTree(project.configurations.windowsTools.singleFile).matching {
            include 'com/sun/tools/attach/**'
        }
    }
    manifest {
        attributes 'Main-Class': 'indi.augusttheodor.AgenstMain'
        attributes 'Agent-Class': 'indi.augusttheodor.AgenstMain'
        attributes 'Can-Retransform-Classes': 'true'
        attributes 'Can-Redefine-Classes': 'true'
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'javax/servlet/**'
    exclude 'jakarta/servlet/**'
    exclude 'META-INF/maven/javax.servlet/**'
    exclude 'META-INF/maven/jakarta.servlet/**'
}

task shadowLinux(type: ShadowJar, dependsOn: compileLinux) {
    archiveClassifier = 'linux'
    from compileLinux.destinationDirectory
    setConfigurations([project.configurations.runtimeClasspath])
    relocate 'javassist', 'indi.augusttheodor.shaded.javassist'
    from {
        zipTree(project.configurations.linuxTools.singleFile).matching {
            include 'com/sun/tools/attach/**'
        }
    }
    manifest {
        attributes 'Main-Class': 'indi.augusttheodor.AgenstMain'
        attributes 'Agent-Class': 'indi.augusttheodor.AgenstMain'
        attributes 'Can-Retransform-Classes': 'true'
        attributes 'Can-Redefine-Classes': 'true'
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'javax/servlet/**'
    exclude 'jakarta/servlet/**'
    exclude 'META-INF/maven/javax.servlet/**'
    exclude 'META-INF/maven/jakarta.servlet/**'
}

jar.enabled = false

assemble.dependsOn shadowJar
assemble.dependsOn shadowLinux

test {
    useJUnitPlatform()
}
