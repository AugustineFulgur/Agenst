plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'indi.augusttheodor.agenst'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.javassist:javassist:3.30.2-GA'
}

def currentJdk = JavaVersion.current()
def currentJdkMajor = currentJdk.majorVersion.toInteger()
def isJdk8 = !currentJdk.isJava9Compatible()
def currentJavaHome = file(System.getProperty('java.home'))
def currentToolsJar = file("${currentJavaHome}/lib/tools.jar")
if (!currentToolsJar.exists() && currentJavaHome.name == 'jre') {
    currentToolsJar = file("${currentJavaHome.parentFile}/lib/tools.jar")
}
def jdkClassifier = "jdk${currentJdkMajor}"

if (isJdk8 && !currentToolsJar.exists()) {
    throw new GradleException("JDK 8 build requires ${currentToolsJar}")
}

configurations {
    jdkTools
}

dependencies {
    if (isJdk8) {
        jdkTools files(currentToolsJar)
    }
}

def jdkToolsFile = isJdk8 ? configurations.jdkTools.singleFile : null

compileJava {
    classpath = configurations.compileClasspath + (isJdk8 ? configurations.jdkTools : files())
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (isJdk8) {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    } else {
        options.release = currentJdkMajor
    }
}

task compileLinux(type: JavaCompile) {
    source = sourceSets.main.java
    classpath = configurations.compileClasspath + (isJdk8 ? configurations.jdkTools : files())
    destinationDirectory = file("${buildDir}/classes/linux")
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

shadowJar {
    archiveClassifier = "${jdkClassifier}-windows"
    relocate 'javassist', 'indi.augusttheodor.shaded.javassist'
    if (isJdk8) {
        from {
            zipTree(jdkToolsFile).matching {
                include 'com/sun/tools/attach/**'
            }
        }
    }
    manifest {
        attributes 'Main-Class': 'indi.augusttheodor.AgenstMain'
        attributes 'Agent-Class': 'indi.augusttheodor.AgenstMain'
        attributes 'Can-Retransform-Classes': 'true'
        attributes 'Can-Redefine-Classes': 'true'
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'javax/servlet/**'
    exclude 'jakarta/servlet/**'
    exclude 'META-INF/maven/javax.servlet/**'
    exclude 'META-INF/maven/jakarta.servlet/**'
}

task shadowLinux(type: ShadowJar, dependsOn: compileLinux) {
    archiveClassifier = "${jdkClassifier}-linux"
    from compileLinux.destinationDirectory
    setConfigurations([project.configurations.runtimeClasspath])
    relocate 'javassist', 'indi.augusttheodor.shaded.javassist'
    if (isJdk8) {
        from {
            zipTree(jdkToolsFile).matching {
                include 'com/sun/tools/attach/**'
            }
        }
    }
    manifest {
        attributes 'Main-Class': 'indi.augusttheodor.AgenstMain'
        attributes 'Agent-Class': 'indi.augusttheodor.AgenstMain'
        attributes 'Can-Retransform-Classes': 'true'
        attributes 'Can-Redefine-Classes': 'true'
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'javax/servlet/**'
    exclude 'jakarta/servlet/**'
    exclude 'META-INF/maven/javax.servlet/**'
    exclude 'META-INF/maven/jakarta.servlet/**'
}

jar.enabled = false

assemble.dependsOn shadowJar
assemble.dependsOn shadowLinux

test {
    useJUnitPlatform()
}
